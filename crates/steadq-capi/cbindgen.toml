language = "C"
include_guard = "STEADQ_H"
autogen_warning = "/* Warning: this header is generated by cbindgen. Do not edit. */"
style = "both"
usize_is_size_t = true
header = """
#ifdef __cplusplus
extern "C" {
#endif"""
trailer = """
#ifdef __cplusplus
}
#endif"""

[parse]
parse_deps = false
include = ["steadq-capi"]

[export]
include = ["SteadqQueue", "SteadqLease", "SteadqPayloadReader", "SteadqJobId"]
