# Exclude defensive error-path guards from mutation testing.
# These require a fault injection framework (audit cross-cutting improvement #2)
# to meaningfully test, as they protect against corruption/races not
# triggerable through the public API alone.
exclude_re = [
    "receipt_is_authentic",
    "stream_lease_payload",
    "ack_impl.*AlreadyExists",
    "ack_impl.*dest_stat.*vf",
    "open_and_validate_current_lease.*ENOENT.*false",
    "open_and_validate_current_lease.*ENOTDIR.*true",
    "move_to_dead.*Ok",
    "fsck_verify_name_tag.*with true$",
]
