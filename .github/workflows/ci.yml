name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (debug)
        run: cargo build --all
      - name: Build (release)
        run: cargo build --all --release
      - name: Test
        run: cargo test --all
      - name: C ABI build check (C-66)
        run: cargo build -p spoolq-capi
      - name: C ABI integration test (R4-B10)
        run: |
          cargo build -p spoolq-capi
          cc crates/spoolq-capi/tests/test_capi.c             -I crates/spoolq-capi/include             -L target/debug -lspoolq_capi             -o target/capi_test -Wl,-rpath,target/debug
          ./target/capi_test
      - name: Generated file drift check (P1-34)
        run: |
          cargo test -p spoolq-core -- state_machine
          test -f generated/state-machine.rs
          # P1-34: Verify generated file matches checked-in version.
          # The state_machine test regenerates; check for drift.
          git diff --exit-code -- generated/state-machine.rs || \
            (echo "Generated state-machine.rs is out of date. Run: cargo test -p spoolq-core -- state_machine" && exit 1)

  # Fuzz smoke test - gating on PRs
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz smoke (format header)
        run: timeout 90 cargo +nightly fuzz run fuzz_format_header -- -max_len=160 -runs=5000
      - name: Fuzz smoke (filename parser)
        run: timeout 90 cargo +nightly fuzz run fuzz_filename_parser -- -max_len=256 -runs=5000
      - name: Fuzz smoke (CBOR decoder)
        run: timeout 90 cargo +nightly fuzz run fuzz_cbor_decoder -- -max_len=1024 -runs=5000
      - name: Fuzz smoke (bucket arithmetic)
        run: timeout 90 cargo +nightly fuzz run fuzz_bucket_arithmetic -- -max_len=64 -runs=5000

  # Mutation testing - diff-based, gating, parallelized by crate
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        crate:
          - spoolq-format
          - spoolq-names
          - spoolq-math
          - spoolq-fs-linux
          - spoolq-core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-mutants
        run: cargo install cargo-mutants
      - name: Run mutants for ${{ matrix.crate }} (diff-scoped)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff origin/$GITHUB_BASE_REF...HEAD > /tmp/pr.diff
            if [ -s /tmp/pr.diff ]; then
              # Filter diff to files in this crate
              if grep -q "${{ matrix.crate }}" /tmp/pr.diff; then
                cargo mutants -p ${{ matrix.crate }} -j 2 --timeout 20 --in-diff /tmp/pr.diff --cap-lints true
              else
                echo "No changes in ${{ matrix.crate }}, skipping"
              fi
            else
              echo "Empty diff, skipping"
            fi
          else
            cargo mutants -p ${{ matrix.crate }} -j 2 --timeout 20 --cap-lints true
          fi

  # Deep fuzz - extended runs (continue-on-error)
  deep-fuzz:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Deep fuzz (50000 runs per target)
        run: |
          timeout 300 cargo +nightly fuzz run fuzz_format_header -- -max_len=160 -runs=50000
          timeout 300 cargo +nightly fuzz run fuzz_filename_parser -- -max_len=256 -runs=50000
          timeout 300 cargo +nightly fuzz run fuzz_cbor_decoder -- -max_len=1024 -runs=50000

  # TLA+ model presence check (not model checking)
  tla-model-presence:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check TLA+ model exists and is non-empty
        run: |
          if [ -d "model" ] && [ -s "$(find model -name '*.tla' | head -1)" ]; then
            echo "TLA+ model directory exists"
            echo "Note: TLC integration requires Java runtime and model fixes (T6-T8)"
            echo "Known model issues: I1/fileSynced conflict, stale token modeling"
          else
            echo "Warning: No TLA+ model found"
          fi

  # Nightly lane: release-mode extended tests and benchmarks
  nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Extended test run (release)
        run: cargo test --all --release
      - name: Descriptor leak regression (B-02)
        run: cargo test -p spoolq-core -- descriptor
      - name: FD leak stress (T5)
        run: cargo test -p spoolq-core -- fd_leak_stress --release
      - name: Benchmarks (P2-35: no regression gate yet, tracking only)
      # P2-35: Benchmark results are informational. Establish baselines
        run: cargo bench -p spoolq-core --bench queue_ops -- --warm-up-time 1 --measurement-time 3
      - name: Full mutation suite (all crates, no timeout cap)
        continue-on-error: true
        run: |
          cargo install cargo-mutants
          cargo mutants --workspace -j 2 --cap-lints true || true
