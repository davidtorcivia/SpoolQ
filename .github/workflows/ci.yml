name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (debug)
        run: cargo build --all
      - name: Build (release)
        run: cargo build --all --release
      - name: Test
        run: cargo test --all
      - name: C ABI build check (C-66)
        run: cargo build -p spoolq-capi
      - name: Generated file drift check (C-69)
        run: |
          cargo test -p spoolq-core -- state_machine
          test -f generated/state-machine.rs

  # T-07: Fuzz smoke test per PR
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz || true
      - name: Fuzz smoke (format)
        run: |
          cd fuzz
          timeout 60 cargo fuzz run fuzz_format_header -- -max_len=160 -runs=100 || true
      - name: Fuzz smoke (filename parser)
        run: |
          cd fuzz
          timeout 60 cargo fuzz run fuzz_filename_parser -- -max_len=256 -runs=100 || true
      - name: Fuzz smoke (CBOR decoder)
        run: |
          cd fuzz
          timeout 60 cargo fuzz run fuzz_cbor_decoder -- -max_len=1024 -runs=100 || true

  # T-08: Formal model check (C-68)
  tla-model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check TLA+ model exists
        run: |
          if [ -d "model" ]; then
            echo "TLA+ model directory exists"
            # TLC integration is planned but not yet in CI
            echo "TODO: pin TLC version and run model check"
          else
            echo "No TLA+ model directory found"
          fi

  # Nightly lane: extended tests
  nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rusttoolchain@stable
      - name: Extended test run
        run: cargo test --all --release
      - name: Descriptor leak regression (B-02)
        run: cargo test -p spoolq-core -- descriptor
