name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (debug)
        run: cargo build --all
      - name: Build (release)
        run: cargo build --all --release
      - name: Test
        run: cargo test --all
      - name: C ABI build check (C-66)
        run: cargo build -p steadq-capi
      - name: C ABI integration test (R4-B10)
        run: |
          cargo build -p steadq-capi
          cc crates/steadq-capi/tests/test_capi.c             -I crates/steadq-capi/include             -L target/debug -lsteadq_capi             -o target/capi_test -Wl,-rpath,target/debug
          ./target/capi_test
      - name: Generated file drift check (P1-34)
        run: |
          cargo test -p steadq-core -- state_machine
          test -f generated/state-machine.rs
          # P1-34: Verify generated file matches checked-in version.
          # The state_machine test regenerates; check for drift.
          git diff --exit-code -- generated/state-machine.rs || \
            (echo "Generated state-machine.rs is out of date. Run: cargo test -p steadq-core -- state_machine" && exit 1)

  # Fuzz smoke test - gating on PRs
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz smoke (format header)
        run: timeout 90 cargo +nightly fuzz run fuzz_format_header -- -max_len=160 -runs=5000
      - name: Fuzz smoke (filename parser)
        run: timeout 90 cargo +nightly fuzz run fuzz_filename_parser -- -max_len=256 -runs=5000
      - name: Fuzz smoke (CBOR decoder)
        run: timeout 90 cargo +nightly fuzz run fuzz_cbor_decoder -- -max_len=1024 -runs=5000
      - name: Fuzz smoke (bucket arithmetic)
        run: timeout 90 cargo +nightly fuzz run fuzz_bucket_arithmetic -- -max_len=64 -runs=5000

  # Mutation testing - diff-based, gating, parallelized by crate
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        crate:
          - steadq-format
          - steadq-names
          - steadq-math
          - steadq-fs-linux
          - steadq-core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-mutants
        run: cargo install cargo-mutants
      - name: Run mutants for ${{ matrix.crate }} (diff-scoped)
        run: |
          # Always scope mutation testing to the changed lines. Full-crate
          # runs on push to main were unkillable for thin syscall wrappers
          # and pure arithmetic without per-line tests on every operator.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff origin/$GITHUB_BASE_REF...HEAD > /tmp/scope.diff
          else
            # Push to main: previous commit is the merge parent.
            git diff HEAD~1 HEAD > /tmp/scope.diff || git diff HEAD > /tmp/scope.diff
          fi
          if [ ! -s /tmp/scope.diff ]; then
            echo "Empty diff, skipping"
            exit 0
          fi
          if ! grep -q "${{ matrix.crate }}" /tmp/scope.diff; then
            echo "No changes in ${{ matrix.crate }}, skipping"
            exit 0
          fi
          cargo mutants -p ${{ matrix.crate }} -j 2 --timeout 60 --in-diff /tmp/scope.diff --cap-lints true

  # Deep fuzz - extended runs (continue-on-error)
  deep-fuzz:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Deep fuzz (50000 runs per target)
        run: |
          timeout 300 cargo +nightly fuzz run fuzz_format_header -- -max_len=160 -runs=50000
          timeout 300 cargo +nightly fuzz run fuzz_filename_parser -- -max_len=256 -runs=50000
          timeout 300 cargo +nightly fuzz run fuzz_cbor_decoder -- -max_len=1024 -runs=50000

  # TLA+ model checking with TLC
  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download tla2tools
        run: curl -fsSL https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar -o /tmp/tla2tools.jar
      - name: TLC model checking
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -config model/SteadQ.cfg model/SteadQ.tla -workers auto

  # Nightly lane: release-mode extended tests and benchmarks
  nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Extended test run (release)
        run: cargo test --all --release
      - name: Descriptor leak regression (B-02)
        run: cargo test -p steadq-core -- descriptor
      - name: FD leak stress (T5)
        run: cargo test -p steadq-core --release -- fd_leak_stress
      - name: Benchmarks (P2-35 tracking only, no regression gate)
        run: cargo bench -p steadq-core --bench queue_ops -- --warm-up-time 1 --measurement-time 3
      - name: Full mutation suite (all crates, no timeout cap)
        continue-on-error: true
        run: |
          cargo install cargo-mutants
          cargo mutants --workspace -j 2 --cap-lints true || true
