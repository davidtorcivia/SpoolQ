[package]
name = "spoolq-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
spoolq-format = { path = "../crates/spoolq-format" }
spoolq-names = { path = "../crates/spoolq-names" }
spoolq-math = { path = "../crates/spoolq-math" }

[[bin]]
name = "fuzz_format_header"
path = "fuzz_targets/fuzz_format_header.rs"
test = false
doc = false

[[bin]]
name = "fuzz_cbor_decoder"
path = "fuzz_targets/fuzz_cbor_decoder.rs"
test = false
doc = false

[[bin]]
name = "fuzz_filename_parser"
path = "fuzz_targets/fuzz_filename_parser.rs"
test = false
doc = false

[[bin]]
name = "fuzz_bucket_arithmetic"
path = "fuzz_targets/fuzz_bucket_arithmetic.rs"
test = false
doc = false

[workspace]
