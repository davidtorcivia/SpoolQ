[package]
name = "steadq-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
steadq-format = { path = "../crates/steadq-format" }
steadq-names = { path = "../crates/steadq-names" }
steadq-math = { path = "../crates/steadq-math" }
steadq-core = { path = "../crates/steadq-core" }
tempfile = "3"

[[bin]]
name = "fuzz_format_header"
path = "fuzz_targets/fuzz_format_header.rs"
test = false
doc = false

[[bin]]
name = "fuzz_cbor_decoder"
path = "fuzz_targets/fuzz_cbor_decoder.rs"
test = false
doc = false

[[bin]]
name = "fuzz_filename_parser"
path = "fuzz_targets/fuzz_filename_parser.rs"
test = false
doc = false

[[bin]]
name = "fuzz_bucket_arithmetic"
path = "fuzz_targets/fuzz_bucket_arithmetic.rs"
test = false
doc = false

[[bin]]
name = "fuzz_transition_ticket"
path = "fuzz_targets/fuzz_transition_ticket.rs"
test = false
doc = false

[[bin]]
name = "fuzz_operation_sequence"
path = "fuzz_targets/fuzz_operation_sequence.rs"
test = false
doc = false

[[bin]]
name = "fuzz_queue_corruption"
path = "fuzz_targets/fuzz_queue_corruption.rs"
test = false
doc = false

[[bin]]
name = "fuzz_resolve"
path = "fuzz_targets/fuzz_resolve.rs"
test = false
doc = false

[workspace]
